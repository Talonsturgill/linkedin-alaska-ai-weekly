discover:
  enabled: true
  guidance: |
    Surface credible business and trade sources not in this seed list,
    including industry newsletters, analyst firms (Gartner, Forrester, IDC
    when they publish public commentary), federal program offices, court
    dockets touching AK AI deployment, SEC filings from AK-relevant
    companies, and tribal corporation investor communications. Put
    candidates in researcher.new_sources_to_consider with a one-line
    rationale. The maintainer promotes good ones into seed_sources weekly.
    LinkedIn posts by named executives count as a primary source only when
    they announce a contract, hire, deal, or material business event in the
    first person.
