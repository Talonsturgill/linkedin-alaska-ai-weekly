# The launch date drives the volume counter.
# Volume N = floor((today - launch_date).days / 7) + 1
launch_date: 2026-05-12        # YYYY-MM-DD, the date of VOL. 01. Update before first run.
brand_name: "Alaska.Ai"
surface: "LinkedIn"
default_byline: "BY TALON"
default_kicker: "WEEKLY BRIEF"
default_motto: "what's moving in alaska ai, this week"
default_coords: "61°13′N  ·  149°54′W"

# "Cold Take" corrective routine (prompts/contrarian_instructions.md).
# Independent, possibly irregular cadence. No issue counter; the middle slot
# of the kicker line is filled with the claim's discourse category (e.g.
# COLD TAKE · POLICY · 19 MAY 2026). The internal branch slug remains
# claude/linkedin-contrarian-* to preserve dedupe history across the rename.
# These keys are read only by the Cold Take routine; the weekly recap reads
# only launch_date and the default_* keys above.
contrarian_kicker: "COLD TAKE"
contrarian_motto: "the claim, and the part it leaves out"
contrarian_byline: ""

# "The Stack" mechanism-anatomy routine (prompts/stack_instructions.md).
# Independent weekly cadence. No issue counter; the middle slot of the kicker
# line is filled with the mechanism category (e.g. THE STACK · FACILITIES ·
# 19 MAY 2026). Branch namespace claude/linkedin-stack-*. These keys are read
# only by The Stack routine.
stack_kicker: "THE STACK"
stack_motto: "how the machinery actually works"
stack_byline: ""

# "Anchorage Desk" profile routine (prompts/desk_instructions.md).
# Independent weekly cadence. No issue counter; the middle slot of the
# kicker line is filled with the subject's role category (e.g.
# ANCHORAGE DESK · MUNICIPAL · 19 MAY 2026). Branch namespace
# claude/linkedin-desk-*. These keys are read only by the Anchorage Desk
# routine. The column profiles ONE Anchorage AI founder, operator,
# municipal decision-maker, or research lead per week, anchored to a
# specific decision they made or own in the last 30 days.
desk_kicker: "ANCHORAGE DESK"
desk_motto: "decisions, not biographies"
desk_byline: ""
